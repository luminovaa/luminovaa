# Setelah push pertama: buka tab Actions → "Generate contribution snake" → Run workflow
# supaya branch `output` dibuat dan github-snake.svg tersedia.
name: Generate contribution snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: luminovaa
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#ff8fb8&color_dots=#3a1a2c,#6b2447,#b8477a,#f472b6,#ffd1dc
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
